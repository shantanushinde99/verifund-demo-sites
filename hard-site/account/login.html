<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Northwind Travel</title><meta name="description" content="Sign in to manage your Northwind bookings.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🧭%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="../assets/site.css"></head>
<body>
<main>
<nav class="crumbs wrap" aria-label="Breadcrumb"><a href="../">Home</a> › <span aria-current="page">Sign in</span></nav>
<section><div class="wrap" style="max-width:480px"><h1>Sign in</h1><p class="lead">Manage your bookings and documents.</p>
<form id="login" class="panel" novalidate>
<div class="field"><label for="le">Email</label><input id="le" name="email" type="email" autocomplete="username"></div>
<div class="field"><label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" minlength="8"></div>
<p class="err" id="login-err" role="alert"></p>
<button class="btn alt" type="submit">Sign in</button>
<p class="meta">Demo account: demo@northwindtravel.co / travel2026 · <a href="../contact.html">Forgot password?</a></p></form>
<div id="dash" class="ok" hidden><h2>Welcome back, Demo Traveller</h2><p>Upcoming trip: <b>Kyoto Temples &amp; Tea</b>, 12 April 2027 · 2 travellers · deposit paid.</p><button class="btn" id="logout">Sign out</button></div>
</div></section>
</main>
<script src="../assets/site.js"></script>
<script>
const f = document.getElementById("login"), e = document.getElementById("login-err"), dash = document.getElementById("dash");
f.onsubmit = (ev) => { ev.preventDefault();
  if (!f.email.value || !f.password.value) return (e.textContent = "Enter your email and password.");
  if (f.email.value.trim().toLowerCase() !== "demo@northwindtravel.co" || f.password.value !== "travel2026") return (e.textContent = "Incorrect email or password.");
  e.textContent = ""; f.hidden = true; dash.hidden = false; };
document.getElementById("logout").onclick = () => { dash.hidden = true; f.hidden = false; f.reset(); };</script>
</body></html>
