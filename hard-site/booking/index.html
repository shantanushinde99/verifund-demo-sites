<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a trip · Northwind Travel</title><meta name="description" content="Book a Northwind tour in three steps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🧭%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="../assets/site.css"></head>
<body>
<main>
<nav class="crumbs wrap" aria-label="Breadcrumb"><a href="../">Home</a> › <span aria-current="page">Book a trip</span></nav>
<section><div class="wrap" style="max-width:760px"><h1>Book your trip</h1>
<div class="steps" aria-hidden="true"><span data-step="1">1. Trip</span><span data-step="2">2. Lead traveller</span><span data-step="3">3. Review &amp; pay</span></div>
<form id="book" class="panel" novalidate>
<fieldset data-step="1" style="border:0;padding:0">
<div class="field"><label for="tour">Tour</label><select id="tour" name="tour"><option value="">Choose a tour…</option></select><span class="err" data-err="tour"></span></div>
<div class="field"><label for="start">Departure date</label><input id="start" name="start" type="date"><span class="err" data-err="start"></span></div>
<div class="field"><label for="people">Travellers</label><input id="people" name="people" type="number" min="1" max="8" value="2"><span class="err" data-err="people"></span></div>
<button class="btn alt" type="button" data-next>Continue</button></fieldset>
<fieldset data-step="2" style="border:0;padding:0" hidden>
<div class="field"><label for="name">Full name (as on passport)</label><input id="name" name="name" autocomplete="name"><span class="err" data-err="name"></span></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="err" data-err="email"></span></div>
<div class="field"><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel"><span class="err" data-err="phone"></span></div>
<div class="field"><label for="country">Passport country</label><select id="country" name="country"><option value="">Choose…</option><option>United Kingdom</option><option>United States</option><option>Canada</option><option>Australia</option><option>India</option><option>Germany</option><option>Other</option></select><span class="err" data-err="country"></span></div>
<button class="btn" type="button" data-back style="background:#8a97a8">Back</button> <button class="btn alt" type="button" data-next>Review booking</button></fieldset>
<fieldset data-step="3" style="border:0;padding:0" hidden>
<dl class="summary" id="summary"></dl>
<div class="field" style="flex-direction:row"><label style="font-weight:400"><input type="checkbox" name="terms"> I accept the <a href="../legal/terms.html" target="_blank">booking terms</a></label><span class="err" data-err="terms"></span></div>
<button class="btn" type="button" data-back style="background:#8a97a8">Back</button> <button class="btn" type="submit">Confirm &amp; pay deposit</button></fieldset>
</form>
<div id="booked" class="ok" hidden role="status"><h2>Booking confirmed 🎉</h2><p>Reference <b id="ref"></b>. A confirmation has been sent to <b id="to"></b>. Your 20% deposit of <b id="dep"></b> secures your place.</p></div>
</div></section>
</main>
<script src="../assets/site.js"></script>
<script>
const f = document.getElementById("book"); let step = 1, tours = [];
const show = (n) => { step = n; f.querySelectorAll("fieldset").forEach((s) => (s.hidden = +s.dataset.step !== n));
  document.querySelectorAll(".steps span").forEach((s) => s.classList.toggle("on", +s.dataset.step <= n)); };
const err = (k, m) => { f.querySelector(`[data-err=${k}]`).textContent = m || ""; return !m; };
const v = (k) => f.elements[k].value.trim();
f.elements.start.min = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);
const checks = {
  1: () => [err("tour", v("tour") ? "" : "Please choose a tour."),
            err("start", !v("start") ? "Please pick a departure date." : v("start") < f.elements.start.min ? "Departures must be at least 14 days from today." : ""),
            err("people", +v("people") >= 1 && +v("people") <= 8 ? "" : "Between 1 and 8 travellers per booking.")].every(Boolean),
  2: () => [err("name", v("name").split(/\s+/).length >= 2 ? "" : "Please enter your first and last name."),
            err("email", /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email")) ? "" : "Please enter a valid email."),
            err("phone", /^\+?[\d\s-]{8,}$/.test(v("phone")) ? "" : "Please enter a mobile number with country code."),
            err("country", v("country") ? "" : "Please choose a country.")].every(Boolean),
};
const total = () => tours.find((t) => t.slug === v("tour")).priceUsd * +v("people");
const summary = () => { const t = tours.find((x) => x.slug === v("tour"));
  document.getElementById("summary").innerHTML = `<dt>Tour</dt><dd>${t.title}</dd><dt>Departure</dt><dd>${new Date(v("start")).toDateString()}</dd>
  <dt>Travellers</dt><dd>${v("people")}</dd><dt>Lead traveller</dt><dd>${v("name")} · ${v("email")}</dd>
  <dt>Total</dt><dd>${formatPrice(total())}</dd><dt>Deposit due today (20%)</dt><dd>${formatPrice(total() * 0.2)}</dd>`; };
f.addEventListener("click", (e) => {
  if (e.target.matches("[data-next]") && checks[step]()) { show(step + 1); if (step === 3) summary(); }
  if (e.target.matches("[data-back]")) show(step - 1);
});
f.addEventListener("submit", (e) => { e.preventDefault();
  if (!err("terms", f.elements.terms.checked ? "" : "Please accept the booking terms.")) return;
  f.hidden = true; document.querySelector(".steps").hidden = true;
  document.getElementById("ref").textContent = "NW-" + Math.random().toString(36).slice(2, 7).toUpperCase();
  document.getElementById("to").textContent = v("email"); document.getElementById("dep").textContent = formatPrice(total() * 0.2);
  document.getElementById("booked").hidden = false; });
document.addEventListener("currency", () => step === 3 && summary());
loadTours().then((list) => { tours = list;
  f.elements.tour.insertAdjacentHTML("beforeend", list.filter((t) => t.status === "available").map((t) => `<option value="${t.slug}">${t.title} (${t.days} days)</option>`).join(""));
  const pre = new URLSearchParams(location.search).get("tour"); if (pre) f.elements.tour.value = pre; show(1); });</script>
</body></html>
